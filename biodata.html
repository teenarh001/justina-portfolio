<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Biodata Form | Justina Ekwote</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <nav class="navbar">
            <a href="index.html" class="logo">J<span>.</span>E</a>

            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="projects.html" class="active">Projects</a></li>
                <li><a href="planner.html">Academic Planner</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

            <div class="nav-actions">
                <button id="themeToggle" class="theme-toggle">☾</button>
                <button class="menu-toggle" id="menuToggle">☰</button>
            </div>
        </nav>
    </header>

    <main class="biodata-section">

        <section class="biodata-heading">
            <span class="section-label">MY PRACTICAL WORK</span>
            <h1>Student <span>Biodata Form</span></h1>
            <p>Please fill in your personal and academic information below.</p>
        </section>

        <form class="biodata-form">

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname"
                    placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" required>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email"
                    placeholder="Enter your email address" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone"
                    placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <label for="course">Course of Study</label>
                <input type="text" id="course"
                    placeholder="Enter your course" required>
            </div>

            <div class="form-group full-width">
                <label for="address">Residential Address</label>
                <textarea id="address"
                    placeholder="Enter your address" required></textarea>
            </div>

            <button type="submit" class="primary-btn">
                Submit Biodata
            </button>

        </form>

        <div class="biodata-back">
            <a href="projects.html" class="project-link">← Back to Projects</a>
        </div>

    </main>

    <footer class="footer">
        <p>© 2026 Justina Onyeche Ekwote.</p>
    </footer>

    <script src="js/menu.js"></script>
    <script src="js/theme.js"></script>

</body>
</html>
